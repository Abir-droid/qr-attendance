<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Admin Login</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1e1e2e; color: #cdd6f4; padding-top: 80px; }
        .card { background: #313244; display: inline-block; padding: 40px; border-radius: 16px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input[type="password"] { width: 90%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #45475a; background: #1e1e2e; color: white; font-size: 16px; }
        button { width: 98%; padding: 12px; border-radius: 8px; border: none; background: #89b4fa; color: #11111b; font-size: 16px; font-weight: bold; cursor: pointer; }
        .error { color: #f38ba8; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Teacher Portal Login</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <input type="password" name="password" placeholder="Enter Admin Password" required>
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
